<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CA15 Analysis Interface · Benjamin Gibson Deposition</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0&icon_names=live_help" />
<style>
  :root {
    --bg: #1F2020;
    --surface: #272828;
    --surface2: #2e2f2f;
    --border: #3a3b3b;
    --accent: #A5A481;
    --accent2: #5b8fa8;
    --accent3: #7a6e9e;
    --text: #c8cab8;
    --text-dim: #989A89;
    --text-bright: #F4F3E7;
  }

  * { 
    margin: 0; 
    padding: 0; 
    box-sizing: border-box; 
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    line-height: 1.5;
    overflow: hidden;
  }

  .interface-container {
    display: grid;
    grid-template-columns: 250px 1fr 300px;
    grid-template-rows: 1fr 200px;
    gap: 0;
    height: 100vh;
    width: 100vw;
  }

  /* PANEL BASE STYLES */
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    overflow-y: auto;
    overflow-x: hidden;
  }

  .panel-header {
    padding: 16px 20px;
    background: #000000;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .panel-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    text-align: center;
  }

  .panel-content {
    padding: 20px;
  }

  /* LEFT PANEL */
  .left-panel {
    grid-column: 1;
    grid-row: 1;
    border-right: 1px solid var(--border);
  }

  /* MAIN PANEL */
  .main-panel {
    grid-column: 2;
    grid-row: 1;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
  }

  .main-panel .panel-content {
    flex: 1;
    padding: 0;
    display: flex;
  }

  #main-content-frame {
    width: 100%;
    height: 100%;
    border: none;
    flex: 1;
  }

  /* RIGHT PANEL */
  .right-panel {
    grid-column: 3;
    grid-row: 1;
  }

  /* BOTTOM PANEL */
  .bottom-panel {
    grid-column: 1 / 4;
    grid-row: 2;
    border-top: 1px solid var(--border);
  }
  
  .bottom-panel .panel-content {
    padding: 0;
    height: 100%;
    display: flex;
    flex-direction: column;
  }

  /* PLACEHOLDER STYLING */
  .placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--text-dim);
    font-style: italic;
    text-align: center;
    padding: 40px;
  }

  /* SCROLLBAR STYLING */
  .panel::-webkit-scrollbar {
    width: 8px;
  }

  .panel::-webkit-scrollbar-track {
    background: var(--surface2);
  }

  .panel::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 4px;
  }

  .panel::-webkit-scrollbar-thumb:hover {
    background: var(--accent);
  }

  /* BATTERY BUTTONS */
  .battery-section {
    margin-bottom: 20px;
  }

  .section-label {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 8px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }

  .battery-btn {
    width: 100%;
    padding: 10px 16px;
    margin-bottom: 6px;
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    text-align: left;
    cursor: pointer;
    transition: all 0.2s;
  }

  .battery-btn:hover {
    background: var(--surface);
    border-color: var(--accent);
    color: var(--text-bright);
  }

  .battery-btn.active {
    background: #000000;
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 500;
  }

  /* FILTER BUTTONS (RIGHT PANEL) */
  .filter-controls {
    padding: 12px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }

  .filter-row {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-bottom: 8px;
  }

  .filter-row:last-child {
    margin-bottom: 0;
  }

  .filter-group-label {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 8px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-dim);
    min-width: 70px;
  }

  .filter-btn {
    padding: 5px 8px;
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 3px;
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .filter-btn:hover {
    background: var(--surface);
    border-color: var(--accent);
    color: var(--text-bright);
  }

  .filter-btn.active {
    background: #000000;
    border-color: var(--accent);
    color: var(--accent);
  }

  .filter-btn.disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }

  .filter-btn.disabled:hover {
    background: var(--surface2);
    border-color: var(--border);
    color: var(--text);
  }

  .pair-summaries {
    padding: 16px;
  }

  /* PAIR SUMMARY BLOCKS */
  .pair-block {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 10px 12px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .pair-block:hover {
    background: var(--surface);
    border-color: var(--accent);
  }

  .pair-block.selected {
    border-color: var(--accent);
    background: var(--surface);
    box-shadow: 0 0 0 1px var(--accent);
  }

  .pair-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }

  .pair-num {
    font-family: 'Syne', sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: var(--accent);
  }

  .pair-loc {
    font-size: 9px;
    color: var(--text-dim);
  }

  .pair-content {
    font-size: 10px;
    line-height: 1.5;
  }

  .pair-pattern {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 12px;
    font-weight: 600;
    font-style: normal;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--text-bright);
    margin-bottom: 6px;
  }

  .pair-reasoning,
  .pair-summary {
    color: var(--text);
    margin-bottom: 6px;
  }

  .pair-scores {
    display: flex;
    gap: 12px;
    font-size: 9px;
    color: var(--text-dim);
    margin-top: 6px;
  }

  .pair-score-item {
    display: flex;
    align-items: baseline;
    gap: 4px;
  }

  .pair-score-label {
    color: var(--text-dim);
  }

  .pair-score-value {
    color: var(--accent);
    font-weight: 500;
  }

  .jur-section {
    margin-bottom: 8px;
  }

  .jur-section:last-child {
    margin-bottom: 0;
  }

  .jur-label {
    font-family: 'Syne', sans-serif;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 4px;
  }

  .entity-summary {
    font-size: 9px;
    line-height: 1.6;
    color: var(--text);
  }

  .entity-count {
    font-weight: 500;
    color: var(--text-bright);
    margin-bottom: 4px;
  }
</style>
</head>
<body>

<div class="interface-container">
  
  <!-- LEFT PANEL: Battery Navigation -->
  <div class="panel left-panel">
    <div class="panel-header">
      <div class="panel-title">Battery Navigation</div>
    </div>
    <div class="panel-content">
      <div class="battery-section">
        <div class="section-label">PRIMARY</div>
        <button class="battery-btn active" id="btn-em" onclick="selectBattery('em')">
          Epistemic Motion
        </button>
        <button class="battery-btn" id="btn-fa" onclick="selectBattery('fa')">
          Forensic Analysis
        </button>
        <button class="battery-btn" id="btn-sc" onclick="selectBattery('sc')">
          Semantic Content
        </button>
      </div>

      <div class="battery-section">
        <div class="section-label">STRATEGIC</div>
        <button class="battery-btn" id="btn-client" onclick="selectStrategic('client')">
          Client
        </button>
        <button class="battery-btn" id="btn-opposition" onclick="selectStrategic('opposition')">
          Opposition
        </button>
      </div>

      <div class="battery-section">
        <div class="section-label">EVALUATIVE</div>
        <button class="battery-btn" id="btn-wpb" onclick="selectBattery('wpb')">
          Witness Posture
        </button>
        <button class="battery-btn" id="btn-apb" onclick="selectBattery('apb')">
          Attorney Performance
        </button>
        <button class="battery-btn" id="btn-jsb" onclick="selectBattery('jsb')">
          Jury Selection
        </button>
        <button class="battery-btn" id="btn-eeb" onclick="selectBattery('eeb')">
          Entity Extraction
        </button>
      </div>
    </div>
  </div>

  <!-- MAIN PANEL: Content Display -->
  <div class="panel main-panel">
    <div class="panel-header">
      <div class="panel-title">Analysis Display</div>
    </div>
    <div class="panel-content">
      <iframe id="main-content-frame"></iframe>
    </div>
  </div>

  <!-- RIGHT PANEL: Pair Navigator -->
  <div class="panel right-panel">
    <div class="panel-header">
      <div class="panel-title">Pair Navigator</div>
    </div>
    <div class="panel-content">
      <div class="filter-controls">
        <div class="filter-row">
          <div class="filter-group-label">PRIMARY:</div>
          <button class="filter-btn primary active" id="filter-em" onclick="selectFilter('primary', 'em')">EM</button>
          <button class="filter-btn primary" id="filter-fa" onclick="selectFilter('primary', 'fa')">FA</button>
          <button class="filter-btn primary" id="filter-sc" onclick="selectFilter('primary', 'sc')">SC</button>
        </div>
        
        <div class="filter-row">
          <div class="filter-group-label">STRATEGIC:</div>
          <button class="filter-btn si" id="filter-cl" onclick="selectFilter('si', 'cl')">CL</button>
          <button class="filter-btn si" id="filter-op" onclick="selectFilter('si', 'op')">OP</button>
        </div>
        
        <div class="filter-row">
          <div class="filter-group-label">EVALUATIVE:</div>
          <button class="filter-btn eval" id="filter-wit" onclick="selectFilter('eval', 'wit')">WIT</button>
          <button class="filter-btn eval" id="filter-att" onclick="selectFilter('eval', 'att')">ATT</button>
          <button class="filter-btn eval" id="filter-jur" onclick="selectFilter('eval', 'jur')">JUR</button>
          <button class="filter-btn eval" id="filter-ent" onclick="selectFilter('eval', 'ent')">ENT</button>
        </div>
      </div>
      
      <div class="pair-summaries" id="pair-summaries-container">
        <div class="placeholder">
          Loading pair summaries...
        </div>
      </div>
    </div>
  </div>

  <!-- BOTTOM PANEL: Schema Context -->
  <div class="panel bottom-panel">
    <div class="panel-content" style="height: 100%;">
      <div class="placeholder">
        Battery overview and field definitions will appear here
        <br><br>
        (Default: Battery overview | On ⓘ click: Field-specific schema)
      </div>
    </div>
  </div>

</div>

<script>
// Current state
let currentBattery = 'em';        // em, fa, sc, wpb, apb, jsb, eeb
let strategicModifier = null;     // null, 'client', 'opposition'
let currentPair = 63;             // Currently selected pair (1-395)

// Schema state
let currentSchema = null;         // Currently loaded schema JSON
const schemaCache = {};           // Cache loaded schemas

// Generate battery path based on current pair
function getBatteryPath(battery, pair, modifier = null) {
  const pairStr = String(pair).padStart(4, '0');
  
  const pathMap = {
    'em': `epistemic_motion/pair_${pairStr}_em.html`,
    'fa': `forensic_analysis/pair_${pairStr}_fa.html`,
    'sc': `semantic_content/pair_${pairStr}_sc.html`,
    'em_client': `strategic_interpretation/call7_${pairStr}_em_si.html`,
    'em_opposition': `strategic_interpretation/call7_${pairStr}_em_si_OPPOSITION.html`,
    'fa_client': `strategic_interpretation/call7_${pairStr}_fa_si.html`,
    'fa_opposition': `strategic_interpretation/call7_${pairStr}_fa_si_OPPOSITION.html`,
    'sc_client': `strategic_interpretation/call7_${pairStr}_sc_si.html`,
    'sc_opposition': `strategic_interpretation/call7_${pairStr}_sc_si_OPPOSITION.html`,
    'wpb': `witness_posture/pair_${pairStr}_wpb.html`,
    'apb': `attorney_performance/pair_${pairStr}_apb.html`,
    'jsb_client': `juror_profiles/pair_${pairStr}_jpb_prosecution.html`,
    'jsb_opposition': `juror_profiles/pair_${pairStr}_jpb_defense.html`,
    'eeb': `entity_extraction/pair_${pairStr}_eeb.html`
  };
  
  let key = battery;
  if (modifier && ['em', 'fa', 'sc', 'jsb'].includes(battery)) {
    key = battery + '_' + modifier;
  }
  
  return pathMap[key];
};

function selectBattery(battery) {
  currentBattery = battery;
  
  // Evaluative batteries clear strategic modifier (except JUR)
  if (['wpb', 'apb', 'eeb'].includes(battery)) {
    strategicModifier = null;
    updateStrategicButtons();
  }
  // JUR keeps strategic modifier but requires one to be set
  
  updateBatteryButtons();
  loadCurrentView();
  loadBatterySchema(battery);  // Load schema for this battery
}

function selectStrategic(modifier) {
  // Can only select strategic if on a primary battery OR on JUR
  if (!['em', 'fa', 'sc', 'jsb'].includes(currentBattery)) {
    return;
  }
  
  // Toggle behavior: clicking same button deselects
  if (strategicModifier === modifier) {
    strategicModifier = null;
    // ── SCHEMA WIRING: deselecting SI returns to the base battery schema ──
    loadBatterySchema(currentBattery);
  } else {
    strategicModifier = modifier;
    // ── SCHEMA WIRING: selecting SI loads the appropriate SI schema ──
    const siSchemaKey = modifier === 'opposition' ? 'si_opp' : 'si';
    loadBatterySchema(siSchemaKey);
  }
  
  updateStrategicButtons();
  loadCurrentView();
}

function loadCurrentView() {
  const iframe = document.getElementById('main-content-frame');
  
  // Special case: JUR requires strategic modifier
  if (currentBattery === 'jsb' && !strategicModifier) {
    iframe.srcdoc = `
      <!DOCTYPE html>
      <html>
      <head>
        <style>
          body {
            background: #0d0f14;
            color: #6b7194;
            font-family: 'DM Mono', monospace;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 40px;
          }
        </style>
      </head>
      <body>
        <div>
          Please select either Client or Opposition<br>
          perspective to view Jury Selection Battery.
        </div>
      </body>
      </html>
    `;
    return;
  }
  
  const path = getBatteryPath(currentBattery, currentPair, strategicModifier);
  
  if (path) {
    iframe.src = path;
    iframe.onload = function() {
      const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
      if (!iframeDoc) return;

      // ── Static style injections ──────────────────────────────────────────
      const baseStyle = iframeDoc.createElement('style');
      baseStyle.textContent = `
        .footer { background: #000000 !important; }

        /* FLIP CARD WRAPPER */
        .col-card {
          perspective: 800px;
          background: transparent !important;
          border: none !important;
          padding: 0 !important;
          cursor: pointer;
        }
        .col-card-inner {
          position: relative;
          width: 100%;
          transform-style: preserve-3d;
          transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
          border-radius: 4px;
        }
        .col-card.flipped .col-card-inner {
          transform: rotateY(180deg);
        }
        .col-card-front,
        .col-card-back {
          backface-visibility: hidden;
          -webkit-backface-visibility: hidden;
          border-radius: 4px;
          padding: 10px 12px;
          border: 1px solid var(--border);
          width: 100%;
        }
        .col-card-front {
          background: var(--surface2);
        }
        .col-card-back {
          position: absolute;
          inset: 0;
          background: #000000;
          transform: rotateY(180deg);
          display: flex;
          flex-direction: column;
          gap: 4px;
          overflow: auto;
          padding: 8px 10px;
        }
        .flip-back-banner {
          font-size: 7px;
          font-weight: 700;
          letter-spacing: 0.15em;
          text-transform: uppercase;
          color: var(--accent);
          border-bottom: 1px solid var(--border);
          padding-bottom: 4px;
          margin-bottom: 2px;
          flex-shrink: 0;
        }
        .flip-back-active {
          font-family: 'Space Grotesk', sans-serif;
          font-size: 11px;
          font-weight: 600;
          color: var(--text-bright);
          flex-shrink: 0;
          margin-bottom: 2px;
        }
        .flip-back-cols {
          display: grid;
          grid-template-columns: 1fr 1fr 1fr;
          gap: 6px;
          flex: 1;
          align-items: stretch;
        }
        .flip-back-col {
          background: var(--surface2);
          border: 1px solid var(--border);
          border-radius: 4px;
          padding: 6px 8px;
        }
        .flip-back-col-label {
          font-size: 7px;
          font-weight: 700;
          letter-spacing: 0.12em;
          text-transform: uppercase;
          color: var(--text-dim);
          margin-bottom: 4px;
        }
        .flip-back-col-body {
          font-size: 8px;
          color: var(--text-dim);
          line-height: 1.55;
        }
        /* Make all col-card grids stretch children to equal height */
        [style*="grid-template-columns"] {
          align-items: stretch !important;
        }
        .col-card:hover .col-card-front {
          border-color: var(--accent);
        }
        .col-card.flipped:hover .col-card-front {
          border-color: var(--border);
        }
        .col-card.flipped .col-card-back {
          border-color: var(--accent);
        }
      `;
      iframeDoc.head.appendChild(baseStyle);

      // ── Wrap every .col-card's existing content in front/back structure ──
      iframeDoc.querySelectorAll('.col-card').forEach(card => {
        const fieldId = card.querySelector('[data-field-id]')?.getAttribute('data-field-id') || null;
        const originalHTML = card.innerHTML;

        card.innerHTML = `
          <div class="col-card-inner">
            <div class="col-card-front">${originalHTML}</div>
            <div class="col-card-back" data-field-id="${fieldId}">
              <div class="flip-back-label">Loading…</div>
            </div>
          </div>
        `;

        card.addEventListener('click', function(e) {
          e.stopPropagation();
          const isFlipped = card.classList.contains('flipped');
          if (isFlipped) {
            card.classList.remove('flipped');
          } else {
            card.classList.add('flipped');
            // Ask parent for schema data for this field
            if (fieldId) {
              window.parent.postMessage({ type: 'fieldClick', fieldId }, '*');
            }
          }
        });
      });

      // ── Listen for schema data posted back from parent ───────────────────
      iframeDoc.defaultView.addEventListener('message', function(e) {
        if (!e.data || e.data.type !== 'fieldSchema') return;
        const { fieldId, label, callLabel, section, definition, scaleDescription, valueDescription, whyItMatters, activeValue } = e.data;

        const banner = [callLabel, section, label].filter(Boolean).join(' · ');

        iframeDoc.querySelectorAll(`.col-card-back[data-field-id="${fieldId}"]`).forEach(back => {
          back.innerHTML = `
            <div class="flip-back-banner">${banner}</div>
            ${activeValue ? `<div class="flip-back-active">${activeValue}</div>` : ''}
            <div class="flip-back-cols">
              <div class="flip-back-col">
                <div class="flip-back-col-label">What it measures</div>
                <div class="flip-back-col-body">${definition}</div>
              </div>
              <div class="flip-back-col">
                <div class="flip-back-col-label">How to read this</div>
                <div class="flip-back-col-body">${scaleDescription || valueDescription || '—'}</div>
              </div>
              <div class="flip-back-col">
                <div class="flip-back-col-label">Why it matters</div>
                <div class="flip-back-col-body">${whyItMatters || '—'}</div>
              </div>
            </div>
          `;
        });
      });

      // ── Click anywhere outside a card resets all flipped cards ───────────
      iframeDoc.addEventListener('click', function(e) {
        if (!e.target.closest('.col-card')) {
          iframeDoc.querySelectorAll('.col-card.flipped').forEach(c => c.classList.remove('flipped'));
          if (currentSchema) displaySchemaOverview();
        }
      });
    };
  }
}

// ============================================================================
// SCHEMA LOADING AND DISPLAY
// ============================================================================

// Maps battery codes → schema file paths (relative to interface.html location)
const batterySchemaMap = {
  'em':     'schemas/em_schema.json',
  'fa':     'schemas/forensic_analysis_schema.json',
  'sc':     'schemas/semantic_content_schema.json',
  'si':     'schemas/strategic_interpretation_schema.json',
  'si_opp': 'schemas/strategic_interpretation_opposition_schema.json',
  'wpb':    'schemas/witness_posture_schema.json',
  'apb':    'schemas/attorney_performance_schema.json',
  'jsb':    'schemas/juror_profile_schema.json',
  'eeb':    'schemas/entity_extraction_schema.json'
};

async function loadBatterySchema(batteryCode) {
  // Check cache first
  if (schemaCache[batteryCode]) {
    currentSchema = schemaCache[batteryCode];
    displaySchemaOverview();
    return;
  }
  
  const schemaPath = batterySchemaMap[batteryCode];
  if (!schemaPath) {
    displaySchemaPlaceholder();
    return;
  }
  
  try {
    const response = await fetch(schemaPath);
    if (!response.ok) {
      throw new Error(`Schema not found: ${schemaPath}`);
    }
    const schema = await response.json();
    schemaCache[batteryCode] = schema;
    currentSchema = schema;
    displaySchemaOverview();
  } catch (error) {
    console.log(`Schema not yet available for ${batteryCode}:`, error.message);
    displaySchemaPlaceholder();
  }
}

// ── Read the live displayed value from the iframe for a given field id ──
function getLiveValue(fieldId) {
  try {
    const iframe = document.getElementById('main-content-frame');
    const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;

    const icon = iframeDoc.querySelector(`[data-field-id="${fieldId}"]`);
    if (!icon) return null;

    // The icon lives inside a label element (.field-label etc).
    // data-field-value is on a SIBLING element (.field-answer).
    // Walk up from the icon until we find a container that has
    // a [data-field-value] descendant somewhere inside it.
    let node = icon.parentElement;
    while (node && node !== iframeDoc.body) {
      const valueEl = node.querySelector('[data-field-value]');
      if (valueEl) return valueEl.getAttribute('data-field-value');
      node = node.parentElement;
    }
    return null;
  } catch (e) {
    return null;
  }
}

// ── Render the active-value block for the bottom panel (col 1) ──
function renderActiveValue(field, liveValue) {
  // No live value — return nothing, show no callout
  if (!liveValue || liveValue === '' || liveValue === 'null') {
    return '';
  }

  // Try scale_values (numeric)
  if (field.scale_values) {
    const num = parseFloat(liveValue);
    const tryKeys = [
      liveValue,                          // exact string e.g. "4.0"
      String(Math.round(num)),            // rounded int e.g. "4"
      String(Math.floor(num)),            // floor e.g. "4" from 4.5
      `${Math.floor(num)}_to_${Math.ceil(num)}` // range e.g. "2_to_3"
    ];
    for (const k of tryKeys) {
      if (field.scale_values[k]) {
        return `${liveValue}: ${field.scale_values[k].split('.')[0]}.`;
      }
    }
  }

  // Try enum_values (boolean/categorical — only show the matched one)
  if (field.enum_values) {
    const key = liveValue.toString().toLowerCase();
    if (field.enum_values[key]) {
      return `${liveValue}: ${field.enum_values[key].split('.')[0]}.`;
    }
  }

  // No match found — return nothing
  return '';
}

  document.querySelector('.bottom-panel').addEventListener('click', function() {

  window.addEventListener('message', function(e) {
    if (!e.data || e.data.type !== 'fieldClick') return;
    const fieldId = e.data.fieldId;
    if (!fieldId || !currentSchema) return;

    // Update bottom panel as before
    displayFieldSchema(fieldId);

    // Look up the field in schema

    if (currentSchema.pattern_field?.id === fieldId) field = currentSchema.pattern_field;
    if (!field && Array.isArray(currentSchema.fields))
      field = currentSchema.fields.find(f => f.id === fieldId) || null;

    if (!field) return;

    const iframe = document.getElementById('main-content-frame');
    const liveValue = getLiveValue(fieldId);
    const activeValue = renderActiveValue(field, liveValue);

    iframe.contentWindow.postMessage({
      type:             'fieldSchema',
      fieldId,
      label:            field.label || fieldId,
      callLabel:        field.call !== undefined ? `Call ${field.call}` : '',
      section:          field.parent_section || '',
      definition:       field.definition || field.description || '—',
      scaleDescription: field.scale_description || '',
      valueDescription: field.value_description || '',
      whyItMatters:     field.why_it_matters || '',
      activeValue,
    }, '*');
  });
});

// Track the current load session so stale batches don't overwrite a newer request
let _loadSession = 0;

async function updatePairSummaries() {
  const container = document.getElementById('pair-summaries-container');

  if (filterState.evaluative === 'jur' && !filterState.si) {
    container.innerHTML = `
      <div class="placeholder">
        Please select either client or opposition 
        perspective to view jury selection battery 
        summaries.
      </div>
    `;
    return;
  }

  // Increment session — any in-flight batch from a previous call will see a
  // mismatched session ID and discard its results rather than rendering.
  const session = ++_loadSession;

  // Immediately clear old cards and show a loading indicator
  container.innerHTML = `
    <div class="placeholder" id="pair-loading-indicator">
      <div style="display:flex;flex-direction:column;align-items:center;gap:12px;">
        <div class="pair-load-spinner"></div>
        <div style="font-size:9px;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-dim);">Loading pairs…</div>
      </div>
    </div>
  `;

  // Inject spinner keyframes once
  if (!document.getElementById('pair-spinner-style')) {
    const s = document.createElement('style');
    s.id = 'pair-spinner-style';
    s.textContent = `
      @keyframes pair-spin {
        to { transform: rotate(360deg); }
      }
      .pair-load-spinner {
        width: 18px;
        height: 18px;
        border: 2px solid var(--border);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: pair-spin 0.7s linear infinite;
      }
    `;
    document.head.appendChild(s);
  }

  const BATCH = 20;   // fetch this many files at once
  const total = 395;
  let firstBatch = true;

  try {
    for (let start = 1; start <= total; start += BATCH) {
      if (session !== _loadSession) return;  // a newer request took over — bail

      const end = Math.min(start + BATCH - 1, total);
      const batchNums = [];
      for (let i = start; i <= end; i++) batchNums.push(i);

      // Fetch the whole batch in parallel
      const results = await Promise.all(batchNums.map(n => renderPairSummary(n)));

      if (session !== _loadSession) return;  // check again after await

      const batchHTML = results.filter(Boolean).join('');
      if (!batchHTML) continue;

      if (firstBatch) {
        // Replace the loading indicator with the first real cards
        container.innerHTML = batchHTML;
        firstBatch = false;
      } else {
        container.insertAdjacentHTML('beforeend', batchHTML);
      }

      highlightPair(currentPair);
    }

    // If nothing rendered at all, restore placeholder
    if (firstBatch && session === _loadSession) {
      container.innerHTML = `<div class="placeholder">No summaries available</div>`;
    }

  } catch (error) {
    if (session !== _loadSession) return;
    console.error('Error rendering pair summaries:', error);
    container.innerHTML = `<div class="placeholder">Error loading summaries</div>`;
  }
}

}

async function extractPrimarySummary(pair, battery) {
  const pairStr = String(pair).padStart(4, '0');
  const batteryPaths = {
    'em': `epistemic_motion/pair_${pairStr}_em.html`,
    'fa': `forensic_analysis/pair_${pairStr}_fa.html`,
    'sc': `semantic_content/pair_${pairStr}_sc.html`
  };
  try {
    const response = await fetch(batteryPaths[battery]);
    const text = await response.text();
    const parser = new DOMParser();
    const doc = parser.parseFromString(text, 'text/html');
    const patternEl = doc.querySelector('.pattern-declaration');
    if (patternEl) { patternEl.querySelectorAll('.info-icon, .material-symbols-outlined').forEach(el => el.remove()); }
    const pattern = patternEl?.textContent.trim();
    const reasoning = doc.querySelector('.pattern-reasoning')?.textContent.trim();
    const headerMeta = doc.querySelector('.header-meta')?.textContent;
    const pageMatch = headerMeta?.match(/p\.(\d+)/);
    const lineMatch = headerMeta?.match(/l\.(\d+)/);
    return {
      page: pageMatch ? pageMatch[1] : '?',
      line: lineMatch ? lineMatch[1] : '?',
      content: `
        <div class="pair-pattern">${pattern || 'Pattern not found'}</div>
        <div class="pair-reasoning">${reasoning || ''}</div>
      `
    };
  } catch (error) {
    return null;
  }
}

async function extractStrategicSummary(pair, primary, perspective) {
  const pairStr = String(pair).padStart(4, '0');
  const suffix = perspective === 'op' ? '_OPPOSITION' : '';
  const path = `strategic_interpretation/call7_${pairStr}_${primary}_si${suffix}.html`;
  try {
    const response = await fetch(path);
    const text = await response.text();
    const parser = new DOMParser();
    const doc = parser.parseFromString(text, 'text/html');
    const sigEl = doc.querySelector('.sig-declaration');
    if (sigEl) { sigEl.querySelectorAll('.info-icon, .material-symbols-outlined').forEach(el => el.remove()); }
    const signature = sigEl?.textContent.trim();
    const summaryLabel = Array.from(doc.querySelectorAll('.summary-label')).find(el => el.textContent.includes('Strategic Summary'));
    const summary = summaryLabel?.nextElementSibling?.textContent.trim();
    const scoreRows = doc.querySelectorAll('.score-row');
    let clientScore = '?', oppScore = '?';
    scoreRows.forEach(row => {
      const label = row.querySelector('.score-label')?.textContent;
      const scoreTag = row.querySelector('.tag')?.textContent.trim();
      const scoreValue = scoreTag?.split('/')[0];
      if (label?.includes('Client')) clientScore = scoreValue || '?';
      else if (label?.includes('Opposition')) oppScore = scoreValue || '?';
    });
    const headerMeta = doc.querySelector('.header-meta')?.textContent;
    const pageMatch = headerMeta?.match(/p\.(\d+)/);
    const lineMatch = headerMeta?.match(/l\.(\d+)/);
    return {
      page: pageMatch ? pageMatch[1] : '?',
      line: lineMatch ? lineMatch[1] : '?',
      content: `
        <div class="pair-scores" style="margin-bottom: 8px;">
          <div class="pair-score-item"><span class="pair-score-value">CL:${clientScore} | OP:${oppScore}</span></div>
        </div>

    batteryToLoad = filterState.primary;
    currentBattery = batteryToLoad;
    strategicModifier = filterState.si === 'cl' ? 'client' : 'opposition';
  } else {
    batteryToLoad = filterState.primary;
    currentBattery = batteryToLoad;
    strategicModifier = null;
  }
  updateBatteryButtons();
  updateStrategicButtons();
  loadCurrentView();
  highlightPair(pairNum);
}

function highlightPair(pairNum) {
  document.querySelectorAll('.pair-block').forEach(block => block.classList.remove('selected'));
  const selectedBlock = document.querySelector(`.pair-block[data-pair="${pairNum}"]`);
  if (selectedBlock) selectedBlock.classList.add('selected');
}

let filterState = { primary: 'em', si: null, evaluative: null };

function selectFilter(group, value) {
  if (group === 'primary') {
    filterState.primary = value;
    filterState.evaluative = null;
    document.querySelectorAll('.filter-btn.primary').forEach(btn => btn.classList.remove('active'));
    document.getElementById('filter-' + value).classList.add('active');
    document.querySelectorAll('.filter-btn.eval').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.filter-btn.si').forEach(btn => { btn.classList.remove('disabled'); btn.disabled = false; });
  } else if (group === 'si') {
    if (!filterState.primary && filterState.evaluative !== 'jur') return;
    if (filterState.si === value) {
      filterState.si = null;
      document.getElementById('filter-' + value).classList.remove('active');
    } else {
      filterState.si = value;
      document.querySelectorAll('.filter-btn.si').forEach(btn => btn.classList.remove('active'));
      document.getElementById('filter-' + value).classList.add('active');
    }
  } else if (group === 'eval') {
    filterState.primary = null;
    filterState.evaluative = value;
    document.querySelectorAll('.filter-btn.primary').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.filter-btn.eval').forEach(btn => btn.classList.remove('active'));
    document.getElementById('filter-' + value).classList.add('active');
    if (value === 'jur') {
      document.querySelectorAll('.filter-btn.si').forEach(btn => { btn.classList.remove('disabled'); btn.disabled = false; });
    } else {
      filterState.si = null;
      document.querySelectorAll('.filter-btn.si').forEach(btn => { btn.classList.remove('active'); btn.classList.add('disabled'); btn.disabled = true; });
    }
  }
  updatePairSummaries();
}
</script>
