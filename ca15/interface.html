<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CA15 Analysis Interface · Benjamin Gibson Deposition</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Instrument+Serif:ital@0;1&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14;
    --surface: #13161e;
    --surface2: #1a1e29;
    --border: #252936;
    --accent: #c8a96e;
    --accent2: #5b8fa8;
    --accent3: #7a6e9e;
    --text: #d4d8e8;
    --text-dim: #6b7194;
    --text-bright: #eef0f8;
  }

  * { 
    margin: 0; 
    padding: 0; 
    box-sizing: border-box; 
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    line-height: 1.5;
    overflow: hidden;
  }

  .interface-container {
    display: grid;
    grid-template-columns: 250px 1fr 300px;
    grid-template-rows: 1fr 200px;
    gap: 0;
    height: 100vh;
    width: 100vw;
  }

  /* PANEL BASE STYLES */
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    overflow-y: auto;
    overflow-x: hidden;
  }

  .panel-header {
    padding: 16px 20px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .panel-title {
    font-family: 'Syne', sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--accent);
    text-align: center;
  }

  .panel-content {
    padding: 20px;
  }

  /* LEFT PANEL */
  .left-panel {
    grid-column: 1;
    grid-row: 1;
    border-right: 1px solid var(--border);
  }

  /* MAIN PANEL */
  .main-panel {
    grid-column: 2;
    grid-row: 1;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
  }

  .main-panel .panel-content {
    flex: 1;
    padding: 0;
    display: flex;
  }

  #main-content-frame {
    width: 100%;
    height: 100%;
    border: none;
    flex: 1;
  }

  /* RIGHT PANEL */
  .right-panel {
    grid-column: 3;
    grid-row: 1;
  }

  /* BOTTOM PANEL */
  .bottom-panel {
    grid-column: 1 / 4;
    grid-row: 2;
    border-top: 1px solid var(--border);
  }
  
  .bottom-panel .panel-content {
    padding: 0;
    height: 100%;
    display: flex;
    flex-direction: column;
  }

  /* PLACEHOLDER STYLING */
  .placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--text-dim);
    font-style: italic;
    text-align: center;
    padding: 40px;
  }

  /* SCROLLBAR STYLING */
  .panel::-webkit-scrollbar {
    width: 8px;
  }

  .panel::-webkit-scrollbar-track {
    background: var(--surface2);
  }

  .panel::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 4px;
  }

  .panel::-webkit-scrollbar-thumb:hover {
    background: var(--accent);
  }

  /* BATTERY BUTTONS */
  .battery-section {
    margin-bottom: 20px;
  }

  .section-label {
    font-family: 'Syne', sans-serif;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 8px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }

  .battery-btn {
    width: 100%;
    padding: 10px 16px;
    margin-bottom: 6px;
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    text-align: left;
    cursor: pointer;
    transition: all 0.2s;
  }

  .battery-btn:hover {
    background: var(--surface);
    border-color: var(--accent);
    color: var(--text-bright);
  }

  .battery-btn.active {
    background: var(--surface);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 500;
  }

  /* FILTER BUTTONS (RIGHT PANEL) */
  .filter-controls {
    padding: 12px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }

  .filter-row {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-bottom: 8px;
  }

  .filter-row:last-child {
    margin-bottom: 0;
  }

  .filter-group-label {
    font-family: 'Syne', sans-serif;
    font-size: 8px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-dim);
    min-width: 70px;
  }

  .filter-btn {
    padding: 5px 8px;
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 3px;
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .filter-btn:hover {
    background: var(--surface);
    border-color: var(--accent);
    color: var(--text-bright);
  }

  .filter-btn.active {
    background: var(--surface);
    border-color: var(--accent);
    color: var(--accent);
  }

  .filter-btn.disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }

  .filter-btn.disabled:hover {
    background: var(--surface2);
    border-color: var(--border);
    color: var(--text);
  }

  .pair-summaries {
    padding: 16px;
  }

  /* PAIR SUMMARY BLOCKS */
  .pair-block {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 10px 12px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .pair-block:hover {
    background: var(--surface);
    border-color: var(--accent);
  }

  .pair-block.selected {
    border-color: var(--accent);
    background: var(--surface);
    box-shadow: 0 0 0 1px var(--accent);
  }

  .pair-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }

  .pair-num {
    font-family: 'Syne', sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: var(--accent);
  }

  .pair-loc {
    font-size: 9px;
    color: var(--text-dim);
  }

  .pair-content {
    font-size: 10px;
    line-height: 1.5;
  }

  .pair-pattern {
    font-family: 'Instrument Serif', serif;
    font-size: 13px;
    font-style: italic;
    color: var(--text-bright);
    margin-bottom: 6px;
  }

  .pair-reasoning,
  .pair-summary {
    color: var(--text);
    margin-bottom: 6px;
  }

  .pair-scores {
    display: flex;
    gap: 12px;
    font-size: 9px;
    color: var(--text-dim);
    margin-top: 6px;
  }

  .pair-score-item {
    display: flex;
    align-items: baseline;
    gap: 4px;
  }

  .pair-score-label {
    color: var(--text-dim);
  }

  .pair-score-value {
    color: var(--accent);
    font-weight: 500;
  }

  .jur-section {
    margin-bottom: 8px;
  }

  .jur-section:last-child {
    margin-bottom: 0;
  }

  .jur-label {
    font-family: 'Syne', sans-serif;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 4px;
  }

  .entity-summary {
    font-size: 9px;
    line-height: 1.6;
    color: var(--text);
  }

  .entity-count {
    font-weight: 500;
    color: var(--text-bright);
    margin-bottom: 4px;
  }
</style>
</head>
<body>

<div class="interface-container">
  
  <!-- LEFT PANEL: Battery Navigation -->
  <div class="panel left-panel">
    <div class="panel-header">
      <div class="panel-title">Battery Navigation</div>
    </div>
    <div class="panel-content">
      <div class="battery-section">
        <div class="section-label">PRIMARY</div>
        <button class="battery-btn active" id="btn-em" onclick="selectBattery('em')">
          EM Battery
        </button>
        <button class="battery-btn" id="btn-fa" onclick="selectBattery('fa')">
          FA Battery
        </button>
        <button class="battery-btn" id="btn-sc" onclick="selectBattery('sc')">
          SC Battery
        </button>
      </div>

      <div class="battery-section">
        <div class="section-label">STRATEGIC</div>
        <button class="battery-btn" id="btn-client" onclick="selectStrategic('client')">
          Client
        </button>
        <button class="battery-btn" id="btn-opposition" onclick="selectStrategic('opposition')">
          Opposition
        </button>
      </div>

      <div class="battery-section">
        <div class="section-label">EVALUATIVE</div>
        <button class="battery-btn" id="btn-wpb" onclick="selectBattery('wpb')">
          Witness Posture
        </button>
        <button class="battery-btn" id="btn-apb" onclick="selectBattery('apb')">
          Attorney Performance
        </button>
        <button class="battery-btn" id="btn-jsb" onclick="selectBattery('jsb')">
          Jury Selection
        </button>
        <button class="battery-btn" id="btn-eeb" onclick="selectBattery('eeb')">
          Entity Extraction
        </button>
      </div>
    </div>
  </div>

  <!-- MAIN PANEL: Content Display -->
  <div class="panel main-panel">
    <div class="panel-header">
      <div class="panel-title">Analysis Display</div>
    </div>
    <div class="panel-content">
      <iframe id="main-content-frame"></iframe>
    </div>
  </div>

  <!-- RIGHT PANEL: Pair Navigator -->
  <div class="panel right-panel">
    <div class="panel-header">
      <div class="panel-title">Pair Navigator</div>
    </div>
    <div class="panel-content">
      <div class="filter-controls">
        <div class="filter-row">
          <div class="filter-group-label">PRIMARY:</div>
          <button class="filter-btn primary active" id="filter-em" onclick="selectFilter('primary', 'em')">EM</button>
          <button class="filter-btn primary" id="filter-fa" onclick="selectFilter('primary', 'fa')">FA</button>
          <button class="filter-btn primary" id="filter-sc" onclick="selectFilter('primary', 'sc')">SC</button>
        </div>
        
        <div class="filter-row">
          <div class="filter-group-label">STRATEGIC:</div>
          <button class="filter-btn si" id="filter-cl" onclick="selectFilter('si', 'cl')">CL</button>
          <button class="filter-btn si" id="filter-op" onclick="selectFilter('si', 'op')">OP</button>
        </div>
        
        <div class="filter-row">
          <div class="filter-group-label">EVALUATIVE:</div>
          <button class="filter-btn eval" id="filter-wit" onclick="selectFilter('eval', 'wit')">WIT</button>
          <button class="filter-btn eval" id="filter-att" onclick="selectFilter('eval', 'att')">ATT</button>
          <button class="filter-btn eval" id="filter-jur" onclick="selectFilter('eval', 'jur')">JUR</button>
          <button class="filter-btn eval" id="filter-ent" onclick="selectFilter('eval', 'ent')">ENT</button>
        </div>
      </div>
      
      <div class="pair-summaries" id="pair-summaries-container">
        <div class="placeholder">
          Loading pair summaries...
        </div>
      </div>
    </div>
  </div>

  <!-- BOTTOM PANEL: Schema Context -->
  <div class="panel bottom-panel">
    <div class="panel-header">
      <div class="panel-title">Schema Context</div>
    </div>
    <div class="panel-content">
      <div class="placeholder">
        Battery overview and field definitions will appear here
        <br><br>
        (Default: Battery overview | On ⓘ click: Field-specific schema)
      </div>
    </div>
  </div>

</div>

<script>
// Current state
let currentBattery = 'em';        // em, fa, sc, wpb, apb, jsb, eeb
let strategicModifier = null;     // null, 'client', 'opposition'
let currentPair = 63;             // Currently selected pair (1-395)

// Schema state
let currentSchema = null;         // Currently loaded schema JSON
const schemaCache = {};           // Cache loaded schemas

// Generate battery path based on current pair
function getBatteryPath(battery, pair, modifier = null) {
  const pairStr = String(pair).padStart(4, '0');
  
  const pathMap = {
    'em': `epistemic_motion/pair_${pairStr}_em.html`,
    'fa': `forensic_analysis/pair_${pairStr}_fa.html`,
    'sc': `semantic_content/pair_${pairStr}_sc.html`,
    'em_client': `strategic_interpretation/call7_${pairStr}_em_si.html`,
    'em_opposition': `strategic_interpretation/call7_${pairStr}_em_si_OPPOSITION.html`,
    'fa_client': `strategic_interpretation/call7_${pairStr}_fa_si.html`,
    'fa_opposition': `strategic_interpretation/call7_${pairStr}_fa_si_OPPOSITION.html`,
    'sc_client': `strategic_interpretation/call7_${pairStr}_sc_si.html`,
    'sc_opposition': `strategic_interpretation/call7_${pairStr}_sc_si_OPPOSITION.html`,
    'wpb': `witness_posture/pair_${pairStr}_wpb.html`,
    'apb': `attorney_performance/pair_${pairStr}_apb.html`,
    'jsb_client': `juror_profiles/pair_${pairStr}_jpb_prosecution.html`,
    'jsb_opposition': `juror_profiles/pair_${pairStr}_jpb_defense.html`,
    'eeb': `entity_extraction/pair_${pairStr}_eeb.html`
  };
  
  let key = battery;
  if (modifier && ['em', 'fa', 'sc', 'jsb'].includes(battery)) {
    key = battery + '_' + modifier;
  }
  
  return pathMap[key];
};

function selectBattery(battery) {
  currentBattery = battery;
  
  // Evaluative batteries clear strategic modifier (except JUR)
  if (['wpb', 'apb', 'eeb'].includes(battery)) {
    strategicModifier = null;
    updateStrategicButtons();
  }
  // JUR keeps strategic modifier but requires one to be set
  
  updateBatteryButtons();
  loadCurrentView();
  loadBatterySchema(battery);  // Load schema for this battery
}

function selectStrategic(modifier) {
  // Can only select strategic if on a primary battery OR on JUR
  if (!['em', 'fa', 'sc', 'jsb'].includes(currentBattery)) {
    return;
  }
  
  // Toggle behavior: clicking same button deselects
  if (strategicModifier === modifier) {
    strategicModifier = null;
  } else {
    strategicModifier = modifier;
  }
  
  updateStrategicButtons();
  loadCurrentView();
}

function loadCurrentView() {
  const iframe = document.getElementById('main-content-frame');
  
  // Special case: JUR requires strategic modifier
  if (currentBattery === 'jsb' && !strategicModifier) {
    // Show placeholder message instead of loading file
    iframe.srcdoc = `
      <!DOCTYPE html>
      <html>
      <head>
        <style>
          body {
            background: #0d0f14;
            color: #6b7194;
            font-family: 'DM Mono', monospace;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 40px;
          }
        </style>
      </head>
      <body>
        <div>
          Please select either Client or Opposition<br>
          perspective to view Jury Selection Battery.
        </div>
      </body>
      </html>
    `;
    return;
  }
  
  // Get path for current battery, pair, and modifier
  const path = getBatteryPath(currentBattery, currentPair, strategicModifier);
  
  if (path) {
    iframe.src = path;
    
    // Attach ⓘ click handlers once iframe loads
    iframe.onload = function() {
      attachInfoIconHandlers();
    };
  }
}

// ============================================================================
// SCHEMA LOADING AND DISPLAY
// ============================================================================

const batterySchemaMap = {
  'em': 'schemas/em_schema.json',
  'fa': 'schemas/fa_schema.json',
  'sc': 'schemas/sc_schema.json',
  'wpb': 'schemas/wpb_schema.json',
  'apb': 'schemas/apb_schema.json',
  'jsb': 'schemas/jsb_schema.json',
  'eeb': 'schemas/eeb_schema.json'
};

async function loadBatterySchema(batteryCode) {
  // Check cache first
  if (schemaCache[batteryCode]) {
    currentSchema = schemaCache[batteryCode];
    displaySchemaOverview();
    return;
  }
  
  // Load from JSON if file exists
  const schemaPath = batterySchemaMap[batteryCode];
  if (!schemaPath) {
    displaySchemaPlaceholder();
    return;
  }
  
  try {
    const response = await fetch(schemaPath);
    if (!response.ok) {
      throw new Error(`Schema not found: ${schemaPath}`);
    }
    const schema = await response.json();
    schemaCache[batteryCode] = schema;
    currentSchema = schema;
    displaySchemaOverview();
  } catch (error) {
    console.log(`Schema not yet available for ${batteryCode}:`, error.message);
    displaySchemaPlaceholder();
  }
}

function displaySchemaOverview() {
  const panel = document.querySelector('.bottom-panel .panel-content');
  if (!currentSchema) {
    displaySchemaPlaceholder();
    return;
  }
  
  panel.innerHTML = `
    <div style="padding: 10px 16px;">
      <div style="font-family: 'Syne', sans-serif; font-size: 8px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px;">
        ${currentSchema.battery_name} · Overview
      </div>
      <div style="font-size: 9px; color: var(--text-dim); line-height: 1.5;">
        ${currentSchema.battery_overview}
      </div>
    </div>
  `;
}

function displayFieldSchema(fieldId) {
  const panel = document.querySelector('.bottom-panel .panel-content');
  if (!currentSchema) return;
  
  // Find field in schema
  let field = null;
  if (currentSchema.pattern_field && currentSchema.pattern_field.id === fieldId) {
    field = currentSchema.pattern_field;
  } else {
    field = currentSchema.fields.find(f => f.id === fieldId);
  }
  
  if (!field) {
    console.log(`Field ${fieldId} not found in schema`);
    return;
  }
  
  panel.innerHTML = `
    <div style="padding: 10px 16px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; height: 100%;">
      <div>
        <div style="font-family: 'Syne', sans-serif; font-size: 8px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: var(--accent); margin-bottom: 4px;">
          ${field.label}
          <span style="font-size: 7px; font-weight: 400; color: var(--text-dim); margin-left: 6px;">Call ${field.call}</span>
        </div>
        <div style="font-size: 8px; font-weight: 600; color: var(--text-bright); margin-bottom: 2px;">What it measures:</div>
        <div style="font-size: 8px; color: var(--text-dim); line-height: 1.5;">${field.definition}</div>
      </div>
      <div>
        <div style="font-size: 8px; font-weight: 600; color: var(--text-bright); margin-bottom: 2px;">Scale/Range:</div>
        <div style="font-size: 8px; color: var(--text-dim); line-height: 1.5; margin-bottom: 8px;">${field.scale}</div>
        ${field.examples ? `
        <div>
          <div style="font-size: 8px; font-weight: 600; color: var(--text-bright); margin-bottom: 2px;">Examples:</div>
          <div style="font-size: 8px; color: var(--text-dim); line-height: 1.5; font-style: italic;">${field.examples}</div>
        </div>
        ` : ''}
      </div>
      <div>
        <div style="font-size: 8px; font-weight: 600; color: var(--text-bright); margin-bottom: 2px;">Why it matters:</div>
        <div style="font-size: 8px; color: var(--text-dim); line-height: 1.5; margin-bottom: 8px;">${field.why_it_matters}</div>
        <button onclick="displaySchemaOverview()" style="background: var(--surface2); color: var(--accent); border: 1px solid var(--border); padding: 4px 10px; border-radius: 3px; font-size: 8px; cursor: pointer; font-family: 'DM Mono', monospace;">
          ← Back to ${currentSchema.battery_name} overview
        </button>
      </div>
    </div>
  `;
}

function displaySchemaPlaceholder() {
  const panel = document.querySelector('.bottom-panel .panel-content');
  panel.innerHTML = `
    <div class="placeholder">
      Schema for this battery will be available soon
    </div>
  `;
}

function attachInfoIconHandlers() {
  const iframe = document.getElementById('main-content-frame');
  const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
  
  if (!iframeDoc) return;
  
  const infoIcons = iframeDoc.querySelectorAll('.info-icon');
  
  infoIcons.forEach(icon => {
    icon.addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();
      const fieldId = this.getAttribute('data-field-id');
      if (fieldId) {
        displayFieldSchema(fieldId);
      }
    });
  });
  
  // Click anywhere in iframe (except info icons) returns to overview
  iframeDoc.addEventListener('click', function(e) {
    // If clicked element is not an info icon
    if (!e.target.classList.contains('info-icon')) {
      displaySchemaOverview();
    }
  });
}

function updateBatteryButtons() {
  // Clear all battery button active states
  document.querySelectorAll('.battery-btn').forEach(btn => {
    if (!btn.id.startsWith('btn-client') && !btn.id.startsWith('btn-opposition')) {
      btn.classList.remove('active');
    }
  });
  
  // Set active battery
  const batteryBtn = document.getElementById('btn-' + currentBattery);
  if (batteryBtn) {
    batteryBtn.classList.add('active');
  }
}

function updateStrategicButtons() {
  const clientBtn = document.getElementById('btn-client');
  const oppBtn = document.getElementById('btn-opposition');
  
  // Enable strategic buttons if on PRIMARY or JUR
  if (['em', 'fa', 'sc', 'jsb'].includes(currentBattery)) {
    clientBtn.classList.remove('disabled');
    oppBtn.classList.remove('disabled');
  } else {
    clientBtn.classList.add('disabled');
    oppBtn.classList.add('disabled');
  }
  
  // Update active states
  clientBtn.classList.remove('active');
  oppBtn.classList.remove('active');
  
  if (strategicModifier === 'client') {
    clientBtn.classList.add('active');
  } else if (strategicModifier === 'opposition') {
    oppBtn.classList.add('active');
  }
}

// Load EM battery on page load
window.addEventListener('DOMContentLoaded', function() {
  loadCurrentView();
  updatePairSummaries(); // Load pair summaries
  loadBatterySchema(currentBattery); // Load initial schema (EM)
});

// Pair summary data extraction and rendering
async function updatePairSummaries() {
  const container = document.getElementById('pair-summaries-container');
  
  // Check if JUR is selected without CL/OP
  if (filterState.evaluative === 'jur' && !filterState.si) {
    container.innerHTML = `
      <div class="placeholder">
        Please select either client or opposition 
        perspective to view jury selection battery 
        summaries.
      </div>
    `;
    return;
  }
  
  // Generate simple pair list (1-395)
  let summariesHTML = '';
  for (let i = 1; i <= 395; i++) {
    const pairStr = String(i).padStart(4, '0');
    summariesHTML += `
      <div class="pair-block" data-pair="${i}" onclick="loadPairFromSummary(${i})">
        <div class="pair-header">
          <span class="pair-num">Pair ${pairStr}</span>
        </div>
      </div>
    `;
  }
  container.innerHTML = summariesHTML;
  
  // Highlight current pair
  highlightPair(currentPair);
}

async function renderPairSummary(pairNum) {
  const pairStr = String(pairNum).padStart(4, '0');
  
  // Determine which battery to extract based on filter state
  let summaryData;
  
  if (filterState.evaluative) {
    // EVALUATIVE battery selected
    summaryData = await extractEvaluativeSummary(pairNum, filterState.evaluative, filterState.si);
  } else if (filterState.si) {
    // STRATEGIC overlay selected
    summaryData = await extractStrategicSummary(pairNum, filterState.primary, filterState.si);
  } else if (filterState.primary) {
    // PRIMARY battery selected
    summaryData = await extractPrimarySummary(pairNum, filterState.primary);
  }
  
  if (!summaryData) {
    return ''; // No data
  }
  
  // Render summary block
  return `
    <div class="pair-block" data-pair="${pairNum}" onclick="loadPairFromSummary(${pairNum})">
      <div class="pair-header">
        <span class="pair-num">PAIR ${pairNum}</span>
        <span class="pair-loc">Pg ${summaryData.page}, Ln ${summaryData.line}</span>
      </div>
      <div class="pair-content">
        ${summaryData.content}
      </div>
    </div>
  `;
}

async function extractPrimarySummary(pair, battery) {
  const pairStr = String(pair).padStart(4, '0');
  const batteryPaths = {
    'em': `epistemic_motion/pair_${pairStr}_em.html`,
    'fa': `forensic_analysis/pair_${pairStr}_fa.html`,
    'sc': `semantic_content/pair_${pairStr}_sc.html`
  };
  
  try {
    const response = await fetch(batteryPaths[battery]);
    const text = await response.text();
    const parser = new DOMParser();
    const doc = parser.parseFromString(text, 'text/html');
    
    // Extract Call 6 pattern and reasoning
    const pattern = doc.querySelector('.pattern-declaration')?.textContent.trim();
    const reasoning = doc.querySelector('.pattern-reasoning')?.textContent.trim();
    
    // Extract page/line from header
    const headerMeta = doc.querySelector('.header-meta')?.textContent;
    const pageMatch = headerMeta?.match(/p\.(\d+)/);
    const lineMatch = headerMeta?.match(/l\.(\d+)/);
    
    return {
      page: pageMatch ? pageMatch[1] : '?',
      line: lineMatch ? lineMatch[1] : '?',
      content: `
        <div class="pair-pattern">${pattern || 'Pattern not found'}</div>
        <div class="pair-reasoning">${reasoning || ''}</div>
      `
    };
  } catch (error) {
    console.error('Error extracting primary summary:', error);
    return null;
  }
}

async function extractStrategicSummary(pair, primary, perspective) {
  const pairStr = String(pair).padStart(4, '0');
  const suffix = perspective === 'op' ? '_OPPOSITION' : '';
  const path = `strategic_interpretation/call7_${pairStr}_${primary}_si${suffix}.html`;
  
  try {
    const response = await fetch(path);
    const text = await response.text();
    const parser = new DOMParser();
    const doc = parser.parseFromString(text, 'text/html');
    
    // Extract signature
    const signature = doc.querySelector('.sig-declaration')?.textContent.trim();
    
    // Extract summary
    const summaryLabel = Array.from(doc.querySelectorAll('.summary-label')).find(el => 
      el.textContent.includes('Strategic Summary')
    );
    const summary = summaryLabel?.nextElementSibling?.textContent.trim();
    
    // Extract scores - parse the score-row divs
    const scoreRows = doc.querySelectorAll('.score-row');
    let clientScore = '?';
    let oppScore = '?';
    
    scoreRows.forEach(row => {
      const label = row.querySelector('.score-label')?.textContent;
      const scoreTag = row.querySelector('.tag')?.textContent.trim(); // Gets "7/10" or "5/10"
      const scoreValue = scoreTag?.split('/')[0]; // Just the number before /
      
      if (label?.includes('Client')) {
        clientScore = scoreValue || '?';
      } else if (label?.includes('Opposition')) {
        oppScore = scoreValue || '?';
      }
    });
    
    // Extract page/line
    const headerMeta = doc.querySelector('.header-meta')?.textContent;
    const pageMatch = headerMeta?.match(/p\.(\d+)/);
    const lineMatch = headerMeta?.match(/l\.(\d+)/);
    
    return {
      page: pageMatch ? pageMatch[1] : '?',
      line: lineMatch ? lineMatch[1] : '?',
      content: `
        <div class="pair-scores" style="margin-bottom: 8px;">
          <div class="pair-score-item">
            <span class="pair-score-value">CL:${clientScore} | OP:${oppScore}</span>
          </div>
        </div>
        <div class="pair-pattern">Signature: ${signature || 'Not found'}</div>
        <div class="pair-summary">${summary || ''}</div>
      `
    };
  } catch (error) {
    console.error('Error extracting strategic summary:', error);
    return null;
  }
}

async function extractEvaluativeSummary(pair, battery, perspective) {
  const pairStr = String(pair).padStart(4, '0');
  
  if (battery === 'wit') {
    return await extractWPBSummary(pair);
  } else if (battery === 'att') {
    return await extractAPBSummary(pair);
  } else if (battery === 'jur') {
    return await extractJURSummary(pair, perspective);
  } else if (battery === 'ent') {
    return await extractENTSummary(pair);
  }
  
  return null;
}

  try {
    const response = await fetch(path);

    // Extract wants pattern and reasoning from "tab-wants" section

function loadPairFromSummary(pairNum) {
  currentPair = pairNum;
  
  // Determine which battery to load based on current filter state
  let batteryToLoad;
  
  if (filterState.evaluative) {
    // EVALUATIVE battery selected - map to battery codes
    const evalMap = {
      'wit': 'wpb',
      'att': 'apb',
      'jur': 'jsb',
      'ent': 'eeb'
    };
    batteryToLoad = evalMap[filterState.evaluative];
    currentBattery = batteryToLoad;
    strategicModifier = null;
  } else if (filterState.si) {
    // STRATEGIC overlay selected
    batteryToLoad = filterState.primary;
    currentBattery = batteryToLoad;
    strategicModifier = filterState.si === 'cl' ? 'client' : 'opposition';
  } else {
    // PRIMARY battery selected
    batteryToLoad = filterState.primary;
    currentBattery = batteryToLoad;
    strategicModifier = null;
  }
  
  // Update left panel to match
  updateBatteryButtons();
  updateStrategicButtons();
  
  // Load the view
  loadCurrentView();
  
  // Highlight selected pair
  highlightPair(pairNum);
}

function highlightPair(pairNum) {
  document.querySelectorAll('.pair-block').forEach(block => {
    block.classList.remove('selected');
  });
  const selectedBlock = document.querySelector(`.pair-block[data-pair="${pairNum}"]`);
  if (selectedBlock) {
    selectedBlock.classList.add('selected');
  }
}

// Filter state management
let filterState = {
  primary: 'em',      // em, fa, sc
  si: null,           // cl, op, or null
  evaluative: null    // wit, att, jur, ent, or null
};

function selectFilter(group, value) {
  if (group === 'primary') {
    // Selecting PRIMARY clears evaluative
    filterState.primary = value;
    filterState.evaluative = null;
    
    // Update UI
    document.querySelectorAll('.filter-btn.primary').forEach(btn => btn.classList.remove('active'));
    document.getElementById('filter-' + value).classList.add('active');
    
    document.querySelectorAll('.filter-btn.eval').forEach(btn => btn.classList.remove('active'));
    
    // Enable SI buttons
    document.querySelectorAll('.filter-btn.si').forEach(btn => {
      btn.classList.remove('disabled');
      btn.disabled = false;
    });
    
  } else if (group === 'si') {
    // SI can only be selected if primary is active OR if JUR is active
    if (!filterState.primary && filterState.evaluative !== 'jur') return;
    
    // Toggle SI (can deselect)
    if (filterState.si === value) {
      filterState.si = null;
      document.getElementById('filter-' + value).classList.remove('active');
    } else {
      // Deselect other SI, select this one
      filterState.si = value;
      document.querySelectorAll('.filter-btn.si').forEach(btn => btn.classList.remove('active'));
      document.getElementById('filter-' + value).classList.add('active');
    }
    
  } else if (group === 'eval') {
    // Selecting EVALUATIVE clears primary and SI (except for JUR)
    filterState.primary = null;
    filterState.evaluative = value;
    
    // Update UI
    document.querySelectorAll('.filter-btn.primary').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.filter-btn.eval').forEach(btn => btn.classList.remove('active'));
    document.getElementById('filter-' + value).classList.add('active');
    
    // Enable/disable SI buttons based on evaluative selection
    if (value === 'jur') {
      // JUR enables SI buttons
      document.querySelectorAll('.filter-btn.si').forEach(btn => {
        btn.classList.remove('disabled');
        btn.disabled = false;
      });
      // Don't clear SI selection
    } else {
      // Other evaluatives disable SI buttons
      filterState.si = null;
      document.querySelectorAll('.filter-btn.si').forEach(btn => {
        btn.classList.remove('active');
        btn.classList.add('disabled');
        btn.disabled = true;
      });
    }
  }
  
  console.log('Filter state:', filterState);
  updatePairSummaries(); // Refresh summaries based on new filter
}
